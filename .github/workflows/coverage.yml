name: 'Coverage Report'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  coverage:
    name: 'Coverage Report'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: 'Set up Go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26'

    # Coverage is reported in the job summary only. Nothing is written back to
    # the repository, so there is no committed badge to keep in sync.
    - name: 'Report coverage'
      run: ./scripts/coverage.sh >> "${GITHUB_STEP_SUMMARY}"
